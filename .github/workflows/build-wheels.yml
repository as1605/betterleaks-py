name: Build and Publish Wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            cibw_arch: arm64
            goarch: arm64
          - name: macos-x86_64
            os: macos-latest
            cibw_arch: x86_64
            goarch: amd64
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.25'

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.21.3

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BEFORE_ALL_LINUX: >
            sh -c 'ARCH=$(uname -m);
            [ "$ARCH" = "x86_64" ] && GOARCH="amd64" || GOARCH="arm64";
            curl -fsSL "https://go.dev/dl/go1.27.1.linux-${GOARCH}.tar.gz" | tar -C /usr/local -xz &&
            /usr/local/go/bin/go version'
          CIBW_ENVIRONMENT_LINUX: 'PATH="/usr/local/go/bin:$PATH"'

          CIBW_ARCHS_MACOS: ${{ matrix.cibw_arch }}
          CIBW_BEFORE_ALL_MACOS: "go version"
          CIBW_ENVIRONMENT_MACOS: 'CGO_ENABLED=1 GOARCH=${{ matrix.goarch }}'

          CIBW_BEFORE_ALL_WINDOWS: "go version"
          CIBW_ENVIRONMENT_WINDOWS: 'CGO_ENABLED=1'

          # Notice we removed cp38-* to restore Python 3.8 support
          CIBW_SKIP: "cp36-* cp37-* pp* *-win32 *-manylinux_i686 *musllinux*"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {package}/tests"
          CIBW_TEST_SKIP: "*-macosx_x86_64"

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cibw-wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to GitHub Releases
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write   # For GitHub Releases (create release & upload assets)

    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1ab388640d18d72914e27 # v4.1.9
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec87453c663f532452554ff # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
