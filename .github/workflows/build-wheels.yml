name: Build and Publish Wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.21.3

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Install Go inside Linux manylinux container
          CIBW_BEFORE_ALL_LINUX: >
            sh -c 'ARCH=$(uname -m);
            [ "$ARCH" = "x86_64" ] && GOARCH="amd64" || GOARCH="arm64";
            curl -fsSL "https://go.dev/dl/go1.27.1.linux-${GOARCH}.tar.gz" | tar -C /usr/local -xz &&
            /usr/local/go/bin/go version'
          CIBW_ENVIRONMENT_LINUX: 'PATH="/usr/local/go/bin:$PATH"'

          # macOS: build both arm64 and x86_64 on Apple Silicon via Rosetta 2
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          CIBW_BEFORE_ALL_MACOS: "go version"
          CIBW_ENVIRONMENT_MACOS: 'CGO_ENABLED=1'

          # Windows
          CIBW_BEFORE_ALL_WINDOWS: "go version"
          CIBW_ENVIRONMENT_WINDOWS: 'CGO_ENABLED=1'

          # Python versions to target (3.8 is EOL since Oct 2024)
          CIBW_SKIP: "cp36-* cp37-* cp38-* pp* *-win32 *-manylinux_i686 *musllinux*"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {package}/tests"
          # Skip tests for cross-compiled x86_64 on arm64 macOS host
          CIBW_TEST_SKIP: "*-macosx_x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI and GitHub Releases
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: env.HAVE_PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
        env:
          HAVE_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
