[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betterleaks-py"
dynamic = ["version"]
description = "Python bindings for Betterleaks, the high-performance secret and credential detection engine."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Betterleaks Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Go",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
    "wheel",
]

[project.scripts]
betterleaks = "betterleaks.cli:main"
gitleaks = "betterleaks.cli:main"

[project.urls]
Homepage = "https://github.com/as1605/betterleaks-py"
Repository = "https://github.com/as1605/betterleaks-py"
Issues = "https://github.com/as1605/betterleaks-py/issues"
Changelog = "https://github.com/as1605/betterleaks-py/releases"

[tool.setuptools.dynamic]
version = {attr = "betterleaks.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["betterleaks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = ["UP006", "UP045", "FA100"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "12.0"
